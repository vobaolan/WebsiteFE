<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Quan Ca Phe</title>
<style>
    body {
        font-family: sans-serif;
    }
    .menu{
        width: 400px;
        margin: 50px auto;
        border: 5px solid black;
        border-radius: 10px;
        padding: 20px;
        background-color: #fff8dc;
    }
    h1{
        color: rgb(210,105,30);
        text-align: center;
    }
    ul{
        list-style: none;
        line-height: 2;
        width: fit-content;
        margin: 0 auto;
        padding: 0;
    }
    .tenmon{
        color: rgb(139,69, 19);
        font-weight: 700;
    }
    .giatien{
        color: red;
        font-weight: 700;
    }
    .button{
        width: fit-content;
        text-decoration: none;
        border: 2px solid #ccc;
        padding: 10px 20px;
        border-radius: 99px;
        font-weight: 700;
        color: black;
        background-color: white;
        margin: 30px 10px;
        transition: ease 0.25s;
        cursor: pointer;
    }
    .button:hover{
        color: rgb(255, 255, 255);
        background-color: black;
        border-color: orange;
    }
</style>
</head>
<body>
    <div class="menu">
        <h1>MENU QUÁN CÀ PHÊ</h1>
        <ul>
            <li><span class="tenmon">Cà Phê Đen</span> ........................ <span class="giatien">20.000đ</span></li>
            <li><span class="tenmon">Cà Phê Sữa</span> ........................ <span class="giatien">25.000đ</span></li>
            <li><span class="tenmon">Trà Vải Thiều</span> ...................... <span class="giatien">35.000đ</span></li>
            <li><span class="tenmon">Bạc Xỉu</span> ............................... <span class="giatien">30.000đ</span></li>
            <li><span class="tenmon">Trà Đào Cam Sả</span> .................. <span class="giatien">35.000đ</span></li>
        </ul>
        <button class="button">Đặt Ngay</button>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dang Ky Tham Gia Su Kien</title>
</head>
<body>
    <h2>Dang Ky Tham Gia Su Kien</h2>
    <form>
    <table>
        <tr>
            <th>
                <label for="fullname">Ho va ten: </label>
            </th>
            <td>
                <input type="text" id="fullname" placeholder="Nhap ho va ten"> 
            </td>
        </tr>
        <tr>
            <th>
                <label for="email">Email: </label>
            </th>
            <td>
                <input type="email" id="email" placeholder="Nhap email">
            </td>
        </tr>
        <tr>
            <th>
                <label for="eventtime">Thoi gian tham gia: </label>
            </th>
            <td>
                <input type="datetime-local" id="eventtime">
            </td>
        </tr>
        <tr>
            <th>
                <label for="">Gioi Tinh: </label>
            </th>
            <td>
                <input type="radio">Nam
                <input type="radio">Nu
                <input type="radio">Khac
            </td>
        </tr>
        <tr>
            <th>
                <label for="">So thich: </label>
            </th>
            <td>
                <input type="checkbox">The thao
                <input type="checkbox">Am nhac
                <input type="checkbox">Du lich
            </td>
        </tr>
        <tr>
            <th>
                <input type="submit" value="Submit">
                <input type="reset" value="Reset">
            </th>
        </tr>
    </table>
    </form>
</body>
</html>

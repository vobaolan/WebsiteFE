<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h2>Registration Form</h2>
        <table>
            <tr>
                <th>
                    <label for="name">First Name: </label>
                </th>
                <td>
                    <input type="text" id="name" placeholder="Enter First Name">
                </td>
            </tr>
            <tr>
                <th>
                    <label for="lastname">Last Name: </label>
                </th>
                <td>
                    <input type="text" id="lastname" placeholder="Enter Last Name">
                </td>
            </tr>
            <tr>
                <th>
                    <label for="Email">Email: </label>
                </th>
                <td>
                    <input type="text" id="Email" placeholder="Enter Email Address">
                </td>
            </tr>
            <tr>
                <th>
                    <label for="password">Password: </label>
                </th>
                <td>
                    <input type="text" id="password">
                </td>
            </tr>
            <tr>
                <th>
                    <label for="">Gender: </label>
                </th>
                <td>
                    <input type="radio">Male
                    <input type="radio">Female
                    <input type="radio">Other
                </td>
            </tr>
            <tr>
                <th>
                    <label for="">Age: </label>
                </th>
                <td>
                    <input type="number">
                </td>
            </tr>
            <tr>
                <th>
                    <label for="">Preferences:</label>
                </th>
                <td>
                    <input type="checkbox">Acrylic Painting
                    <input type="checkbox">Oil Painting
                    <input type="checkbox">Water Color Painting
                </td>
            </tr>
            <tr>
                <th>
                    <label for="">Select Occupation: </label>
                </th>
                <td>
                    <select>
                    <option>Student</option>
                    <option>Teacher</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th>
                    <label for="">Bio: </label>
                </th>
                <td>
                    <textarea placeholder="Share few lines about yourself...."></textarea>
                </td>
            </tr>
            <tr>
                <th>
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </th>
            </tr>
        </table>
</body>
</html>

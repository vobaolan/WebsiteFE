<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bài Tập 14 - Tính Chỉ Số BMI</title>
  </head>
  <body>
    <h2>Tính Chỉ Số BMI</h2>
    <label for="">Nhập Chiều Cao (Cm)</label>
    <input type="number" id="chieucao" />
    <br />
    <label for="">Nhập Cân Nặng (Kg)</label>
    <input type="number" id="cannang" />
    <br />
    <button onclick="tinhBMI()">Tính BMI</button>
    <p id="result"></p>
    <script>
      function tinhBMI() {
        let chieucao = document.getElementById("chieucao").value;
        let cannang = document.getElementById("cannang").value;
        let result = (cannang / (chieucao * chieucao)).toFixed(1);
        if (result > 30) {
          document.getElementById("result").innerHTML =
            "Điểm BMI: " + result + " bị Béo Phì";
        } else if (result < 30 && result >= 25) {
          document.getElementById("result").innerHTML =
            "Điểm BMI: " + result + " bị Thừa Cân";
        } else if (result < 25 && result >= 18.5) {
          document.getElementById("result").innerHTML =
            "Điểm BMI: " + result + " Bình Thường";
        } else {
          document.getElementById("result").innerHTML =
            "Điểm BMI: " + result + " bị Gầy";
        }
      }
    </script>
  </body>
</html>

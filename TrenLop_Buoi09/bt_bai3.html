<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập 3 - Xếp Loại Học Lực</title>
</head>
<body>
    <h2>Xếp loại học lực</h2>
    <label for="">Nhập điểm: </label>
    <input type="number", id="score">
    <br>
    <button onclick="tinhDiem()">Tính điểm</button>
    <p id="result"></p>
    <script>
        function tinhDiem(){
            let score = document.getElementById("score").value;
            if(score >= 90 && score <= 100){
                document.getElementById("result").innerHTML = score + " Học lực A";
            }else if (score >=80 && score <90){
                document.getElementById("result").innerHTML = score + " Học lực B";
            }else if (score >= 70 && score <80){
                document.getElementById("result").innerHTML = score + " Học lực C";
            }else if (score >= 60 && score < 70){
                document.getElementById("result").innerHTML = score + " Học lực D";
            }else if (score >= 50 && score < 60){
                document.getElementById("result").innerHTML = score + " Học lực F";
            }else{
                document.getElementById("result").innerHTML = "Vui lòng nhập từ 0-100"
            }
        }
    </script>
    
</body>
</body>
</html>

<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content - Bài Tập Tuần 6</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="content">
      <h2>Thực Đơn Nổi Bật</h2>
      <div class="card-container">
        <div class="card">
          <div class="img-placeholder">Cà Phê Phin Đen Đá</div>
          <div class="card-body">
            <h3>Cà Phê Phin Đen Đá</h3>
            <p>Phin Đen Đá mang vị cà phê đậm đà chất Phin.</p>
            <span class="price">29,000 VNĐ</span>
          </div>
        </div>
        <div class="card">
          <div class="img-placeholder">Cà Phê Phin Sữa Đá</div>
          <div class="card-body">
            <h3>Cà Phê Phin Sữa Đá</h3>
            <p>Sự kết hợp hoàn hảo giữa cà phê Phin và sữa đặc.</p>
            <span class="price">29,000 VNĐ</span>
          </div>
        </div>
        <div class="card">
          <div class="img-placeholder">Espresso</div>
          <div class="card-body">
            <h3>Espresso</h3>
            <p>Robusta và Arabica chất lượng hảo hạng.</p>
            <span class="price">45,000 VNĐ</span>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
